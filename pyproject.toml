[build-system]
requires = ["hatchling", "hatch-argparse-manpage"]
build-backend = "hatchling.build"

[project]
name = "show-in-file-manager"
authors = [{ name = "Damon Lynch", email = "damonlynch@gmail.com" }]
description = "Open the system file manager and select files in it"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
    "Topic :: Desktop Environment :: File Managers",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "pyxdg>=0.25; platform_system=='Linux'",
    "packaging",
    "pywin32>=301; platform_system=='Windows'",
]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/damonlynch/showinfilemanager"
Issues = "https://github.com/damonlynch/showinfilemanager/issues"

[project.scripts]
showinfilemanager = "showinfm.showinfm:main"

[tool.hatch.version]
path = "src/showinfm/__about__.py"

[tool.hatch.build.targets.sdist]
include = ["src/showinfm", "/*.md"]
exclude = [".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/showinfm", "man", "/*.md"]

[tool.hatch.build.targets.wheel.hooks.argparse-manpage]
include-url = false
manpages = [
    "man/showinfilemanager.1:function=get_parser:pyfile=src/showinfm/argumentsparse.py:manual_title=General Commands Manual",
]

[tool.hatch.envs.test.scripts]
sifm = "python -Wd -m src.cli --debug {args}"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14", "3.15"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".pytest_cache",
    ".qwen",
    ".ruff_cache",
    "__pypackages__",
    "build",
    "dist",
    "urivalidate.py",
]

# Rules deliberately kept in system/linux.py, each for a reason stated at the site it
# covers. This adds to the per-file ignores that Hatch's ruff defaults supply rather than
# replacing them, and the pattern is anchored with **/ because hatch runs ruff against a
# merged copy of this file in its environment data directory, where a path relative to the
# repository root would not resolve.
#   BLE001  valid_linux_file_manager() and caja_supports_select() swallow every exception,
#           which their docstrings state as their contract.
#   FBT001  translate_wsl_path() and wsl_transform_path_uri() are public and are called
#           positionally by filemanager.py and the tests; keyword-only would break them.
#   PLC0415 wsl_transform_path_uri() imports showinfm.system.tools inside the function
#           because tools reads current_platform as it is imported.
#   PLR2004 len(path) > 2 is the shortest Windows drive path in a file: URI.
#   PLW0603 _linux_desktop is reset by tests/conftest.py and monkeypatched by
#           test_linux_file_manager.py, so it cannot become local.
#   S101    the asserts tie the fields of WSLTransformPathURI together.
#   S607    caja and wslpath are resolved through PATH on purpose.
[tool.ruff.lint.extend-per-file-ignores]
"**/showinfm/system/linux.py" = [
    "BLE001",
    "FBT001",
    "PLC0415",
    "PLR2004",
    "PLW0603",
    "S101",
    "S607",
]

# Rules deliberately kept in filemanager.py, the module that actually launches a file
# manager:
#   FBT001  show_in_file_manager() is the entry point exported from the package, and its
#           booleans are declared positionally; keyword-only would break consumers this
#           project cannot enumerate.
#   FBT002  those same parameters also carry their defaults positionally.
#   S101    the asserts narrow Optional to non-None. Deleting them takes pyrefly from 0
#           errors to 8 in this file, so they are load-bearing, not decoration.
#   S606    os.startfile() is the Windows shell call the code intends; there is no shell
#           left to start.
#   T201    this is the --verbose and --debug output the command line documents.
"**/showinfm/filemanager.py" = [
    "FBT001",
    "FBT002",
    "S101",
    "S606",
    "T201",
]

# Rules deliberately kept in system/windows.py, the module that says out loud what it is
# about to ask the shell to do:
#   BLE001  the import-time capture records whatever pywin32 raised, because the type is
#           not the point and the comment at the clause says so; the reason is read back
#           through _shell_unusable_reason().
#   FBT001  launch_file_explorer() is reachable as showinfm.system.windows' own name, and
#           filemanager.py calls verbose positionally, the same ruling as the two entry
#           points above.
#   FBT002  that parameter carries its default positionally too.
#   T201    the --verbose announcement of the selection it is handing over, and the
#           --debug note naming each argument the glob and URI pass could not place.
#           Both are output the command line documents, as they are in filemanager.py.
"**/showinfm/system/windows.py" = ["BLE001", "FBT001", "FBT002", "T201"]

# Rules deliberately kept in showinfm.py, the package's public surface:
#   BLE001  Diagnostics exists to record whatever detection went wrong, so a narrower
#           clause would let the failure it is meant to report escape the report. The four
#           arms are pinned by tests/system/test_diagnostics.py.
#   FBT001  show_in_file_manager() is the entry point, and the README shows its booleans
#           in a positional signature; keyword-only would break callers this project cannot
#           enumerate, the same ruling as filemanager.py.
#   FBT002  those parameters also carry their defaults positionally.
#   T201    the --debug report main() prints, which is the output that option promises.
"**/showinfm/showinfm.py" = [
    "BLE001",
    "FBT001",
    "FBT002",
    "T201",
]

# Added to the per-file ignores Hatch's own defaults already grant tests (S, PLC1901,
# PLR2004, PLR6301, TID252), which this same glob extends rather than replaces:
#   SLF001  a test of this package has to reach the module attribute the code itself reads,
#           because that is the seam. _PROCESSES and _reap_processes are the process
#           registry with no public accessor; _linux_desktop is the desktop memo that
#           conftest.py has to clear between tests; _shell is what launch_file_explorer()
#           looks up, so a stand-in has to be assigned there; and a few tests call one
#           private method to exercise it without launching anything.
"**/tests/**/*" = ["SLF001"]

# Rules that belong to windows_probe.py's role as the child-interpreter harness:
#   PLC0415  each report function imports showinfm inside itself, on purpose. The module
#            decides at import time whether to attempt win32com.shell, so the import has to
#            follow pretend_windows() and block_win32com(). Hoisting it to the header would
#            import the module as a non-Windows one and the scenario would pass while
#            testing nothing, which is the failure this file's header warns about.
#   BLE001   these clauses exist to copy whatever happened into the report as a type name
#            and a message for the parent to assert on, so the set of types is not known
#            here and narrowing would lose the finding the probe was called for.
#   T201     print(json.dumps(REPORT)) is the whole parent-child protocol; stdout is the
#            only channel, and test_windows.py parses it.
"**/tests/system/windows_probe.py" = [
    "BLE001",
    "PLC0415",
    "T201",
]

[tool.pyrefly]
project-excludes = ["src/showinfm/system/urivalidate.py"]
# pywin32 is imported only when running on Windows, and only where the shell API is
# needed. Treating it as unmapped when absent keeps the members typing.Any, which is what
# they are on the machines that lack the package, without suppressing the import once
# pywin32 is installed.
ignore-missing-imports = ["win32com.shell"]
